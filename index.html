  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/alphaTab.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <script>
    const GP_EXTENSIONS = ['.gp', '.gp3', '.gp4', '.gp5', '.gpx'];
    // Brzmienia do odtwarzania (SoundFont z tej samej wersji biblioteki co alphaTab)
    const SOUNDFONT_URL = 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/soundfont/sonivox.sf3';
    // Indeks katalogu tabs/ budowany przez scripts/build-tabs-index.py i czytany przez sql.js
    const LIBRARY_DB_URL = 'tabs.sqlite';
    const SQL_JS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/';

    const els = {
      fileInput: document.getElementById('fileInput'),
      folderInput: document.getElementById('folderInput'),
      openFileBtn: document.getElementById('openFileBtn'),
      openFolderBtn: document.getElementById('openFolderBtn'),
      printBtn: document.getElementById('printBtn'),
      trackPanelBtn: document.getElementById('trackPanelBtn'),
      trackPanel: document.getElementById('trackPanel'),
      trackPanelInfo: document.getElementById('trackPanelInfo'),
      trackList: document.getElementById('trackList'),
      songInfo: document.getElementById('songInfo'),
      modes: document.querySelectorAll('.mode'),
      tree: document.getElementById('tree'),
      searchInput: document.getElementById('searchInput'),
      searchInfo: document.getElementById('searchInfo'),
      message: document.getElementById('message'),
      messageText: document.getElementById('messageText'),
      placeholder: document.getElementById('placeholder'),
      score: document.getElementById('alphaTab'),
      printArea: document.getElementById('printArea'),
      viewer: document.getElementById('viewer'),
      playBtn: document.getElementById('playBtn'),
      stopBtn: document.getElementById('stopBtn'),
      seekBar: document.getElementById('seekBar'),
      timeInfo: document.getElementById('timeInfo'),
      speedSelect: document.getElementById('speedSelect'),
      masterVolume: document.getElementById('masterVolume'),
      viewButtons: document.querySelectorAll('.view-btn'),
      library: document.getElementById('library'),
      sidebar: document.querySelector('.sidebar'),
      foldersToggle: document.getElementById('foldersToggle'),
      themeToggle: document.getElementById('themeToggle'),
      libSearch: document.getElementById('libSearch'),
      libGenre: document.getElementById('libGenre'),
      libFormat: document.getElementById('libFormat'),
      libCollection: document.getElementById('libCollection'),
      libYearFrom: document.getElementById('libYearFrom'),
      libYearTo: document.getElementById('libYearTo'),
      libSureGenre: document.getElementById('libSureGenre'),
      libReset: document.getElementById('libReset'),
      libCount: document.getElementById('libCount'),
      libBody: document.getElementById('libBody'),
      libMini: document.getElementById('libMini'),
      libMiniTitle: document.getElementById('libMiniTitle'),
      libMiniNotes: document.getElementById('libMiniNotes'),
      libMiniPlay: document.getElementById('libMiniPlay'),
      libMiniStop: document.getElementById('libMiniStop'),
      libPrev: document.getElementById('libPrev'),
      libNext: document.getElementById('libNext'),
      libPage: document.getElementById('libPage'),
      playStatus: document.getElementById('playStatus'),
      nowPlaying: document.getElementById('nowPlaying'),
      footerSong: document.getElementById('footerSong'),
    };

    const api = new alphaTab.AlphaTabApi(els.score, {
      display: { layoutMode: 'page' },
      player: {
        enablePlayer: true,
        playerMode: 'EnabledSynthesizer',
        soundFont: SOUNDFONT_URL,
        enableCursor: true,
        enableUserInteraction: true,
        enableElementHighlighting: true,
        // Na desktopie przewija się panel podglądu, na telefonie cała strona
        scrollElement: window.innerWidth > 720 ? '#viewer' : 'html,body',
      },
    });

    // Lista plików, drzewo katalogów i stan widoku:
    // currentIndex – plik wybrany przez użytkownika, loadedIndex – plik faktycznie wyświetlony,
    // loadToken – licznik wczytań, żeby wolniejsze wczytanie nie nadpisało późniejszego wyboru
    let playlist = [];
    let tree = null;
    let expandedDirs = new Set();
    // Na telefonie panel ścieżek startuje zwinięty, żeby nie zasłaniał partytury; otwiera go przycisk „Ścieżki”
    let trackPanelOpen = window.innerWidth > 720;
    // Panel plików działa tak samo jak panel ścieżek: na telefonie startuje zwinięty
    let foldersOpen = window.innerWidth > 720;
    // Stan odtwarzania dla mini odtwarzacza w bibliotece
    let isPlaying = false;
    // Utwór kliknięty w bibliotece ma zagrać, gdy tylko się wczyta
    let playWhenReady = false;
    let currentIndex = -1;
    let loadedIndex = -1;
    let loadToken = 0;
    let displayMode = 'both';
    let seeking = false;
    let duration = 0;
    let searchQuery = '';
    // Wyniki liczymy raz na zmianę zapytania: searchMatches[i] = 1 dla pasującego utworu
    let searchMatches = null;
    let searchTotal = 0;
    // Przy wyszukiwaniu pokazujemy najwyżej tyle wierszy, żeby krótkie zapytanie nie zamulało drzewa
    const SEARCH_RENDER_LIMIT = 500;
    let renderBudget = Infinity;

    // Ikony Lucide ze sprite'a na początku <body>: podmieniamy tylko odnośnik <use>, więc przyciski zachowują rozmiar
    function iconMarkup(name, solid = false) {
      return `<svg class="icon${solid ? ' solid' : ''}"><use href="#i-${name}"/></svg>`;
    }

    function setIcon(button, name) {
      button.querySelector('use').setAttribute('href', `#i-${name}`);
    }

    // Wypełnienie suwaka (część „primary” toru) ustawiamy zmienną --fill, bo WebKit nie ma ::-moz-range-progress
    function syncRange(input) {
      const min = Number(input.min || 0);
      const max = Number(input.max || 100);
      const fraction = max > min ? (Number(input.value) - min) / (max - min) : 0;
      input.style.setProperty('--fill', `${Math.min(1, Math.max(0, fraction)) * 100}%`);
    }

    document.addEventListener('input', event => {
      if (event.target.matches('input[type="range"]')) syncRange(event.target);
    });

    function showMessage(text) {
      els.messageText.textContent = text;
      els.message.hidden = false;
    }

    function clearMessage() {
      els.message.hidden = true;
      els.messageText.textContent = '';
    }

    function isHidden(name) {
      return name.startsWith('.') || name === '__MACOSX';
    }

    function isGpFile(name) {
      const lower = name.toLowerCase();
      return GP_EXTENSIONS.some(ext => lower.endsWith(ext));
    }

    function isGpPath(path) {
      const parts = path.split('/');
      return !parts.some(isHidden) && isGpFile(parts[parts.length - 1]);
    }

    function trackNamesOf(score) {
      return score.tracks.map((track, index) => track.name || `Ścieżka ${index + 1}`);
    }

    // Kolor kropki przy nazwie ścieżki (według numeru, żeby każda miała swój)
    const TRACK_COLORS = ['#2b6cb0', '#e8590c', '#2f9e44', '#9c36b5', '#c2255c', '#0c8599', '#f08c00', '#5f3dc4'];

    // Głośność (%), wyciszenie i solo każdej ścieżki są zapamiętane dla pliku,
    // więc po wybraniu innego utworu i powrocie wracają razem z nim
    function mixOf(song, trackIndex) {
      if (!song.mix.has(trackIndex)) song.mix.set(trackIndex, { volume: 100, muted: false, solo: false });
      return song.mix.get(trackIndex);
    }

    // Ścieżka brzmi, gdy jest pokazana i nie jest wyciszona. Jeśli któraś pokazana ma solo,
    // brzmią tylko pokazane ścieżki z solo
    function isAudible(song, trackIndex) {
      if (!song.selected.includes(trackIndex)) return false;

      const soloed = song.selected.filter(i => mixOf(song, i).solo);
      if (soloed.length > 0 && !mixOf(song, trackIndex).solo) return false;

      return !mixOf(song, trackIndex).muted;
    }

    // Zbiera pliki GP z przeciągniętego pliku lub folderu (także z podfolderów)
    async function collectFiles(entry, parentPath = '') {
      const path = parentPath + entry.name;

      if (isHidden(entry.name)) return [];

      if (entry.isFile) {
        if (!isGpFile(entry.name)) return [];
        const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
        return [{ file, path }];
      }

      const children = await readAllEntries(entry.createReader());
      const nested = await Promise.all(children.map(child => collectFiles(child, `${path}/`)));
      return nested.flat();
    }

    // readEntries zwraca wpisy porcjami, więc czytamy aż do pustej odpowiedzi
    async function readAllEntries(reader) {
      const entries = [];
      let batch;

      do {
        batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
        entries.push(...batch);
      } while (batch.length > 0);

      return entries;
    }

    // Plik z biblioteki ma adres (url), a przeciągnięty lub wybrany plik ma obiekt File
    async function readSongBytes(song) {
      if (song.url) {
        const response = await fetch(song.url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.arrayBuffer();
      }
      return song.file.arrayBuffer();
    }

    // Kodujemy każdy segment osobno, żeby nazwy ze spacjami i nawiasami działały w adresie
    function libraryUrl(path) {
      return 'tabs/' + path.split('/').map(encodeURIComponent).join('/');
    }

    // Na starcie czytamy tylko indeks z tabs.sqlite; same pliki pobieramy po wybraniu utworu
    async function loadLibrary() {
      showMessage('Wczytywanie biblioteki…');

      try {
        const [SQL, response] = await Promise.all([
          initSqlJs({ locateFile: file => SQL_JS_BASE + file }),
          fetch(LIBRARY_DB_URL),
        ]);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const db = new SQL.Database(new Uint8Array(await response.arrayBuffer()));
        try {
          const rows = db.exec('SELECT path, genre, genre_confidence, year FROM songs ORDER BY path')[0]?.values ?? [];
          setPlaylist(rows.map(([path, genre, genreConfidence, year]) => ({
            path,
            url: libraryUrl(path),
            genre,
            genreConfidence,
            year,
          })));
        } finally {
          db.close();
        }
      } catch (error) {
        showMessage(
          `Nie udało się wczytać biblioteki (${error.message}). ` +
          'Uruchom aplikację z serwera i zbuduj indeks: python3 scripts/build-tabs-index.py'
        );
      }
    }

    // Przy dużej bibliotece foldery startują zwinięte, bo rozwinięcie wszystkich zamula przeglądarkę
    const EXPAND_ALL_LIMIT = 500;

    // Buduje drzewo folderów i plików; małe zestawy mają wszystkie foldery rozwinięte domyślnie
    function buildTree(songs) {
      const root = { type: 'dir', name: '', path: '', children: new Map() };
      const expandAll = songs.length <= EXPAND_ALL_LIMIT;

      songs.forEach((song, index) => {
        const parts = song.path.split('/');
        let dir = root;

        parts.slice(0, -1).forEach((name, depth) => {
          if (!dir.children.has(name)) {
            const path = parts.slice(0, depth + 1).join('/');
            dir.children.set(name, { type: 'dir', name, path, children: new Map() });
            if (expandAll) expandedDirs.add(path);
          }
          dir = dir.children.get(name);
        });

        const fileName = parts[parts.length - 1];
        dir.children.set(fileName, { type: 'file', name: fileName, index });
      });

      return root;
    }

    function setPlaylist(found) {
      const files = found
        .filter(item => isGpPath(item.path))
        .sort((a, b) => a.path.localeCompare(b.path, 'pl', { numeric: true }));

      if (files.length === 0) {
        showMessage('Nie znaleziono plików Guitar Pro (.gp3, .gp4, .gp5, .gpx, .gp).');
        return;
      }

      playlist = files.map((item, index) => {
        const meta = songMeta(item.path);
        return {
          ...item,
          index,
          name: item.path.split('/').pop().replace(/\.[^.]+$/, ''),
          ...meta,
          genre: item.genre ?? null,
          genreConfidence: item.genreConfidence ?? null,
          year: item.year ?? null,
          searchText: normalizeText(`${meta.band} ${meta.title}`),
          searchPath: normalizeText(item.path),
          selected: [0],
          mix: new Map(),
        };
      });

      expandedDirs = new Set();
      currentIndex = -1;
      loadedIndex = -1;
      tree = buildTree(playlist);
      runSearch();
      els.searchInput.disabled = false;
      populateLibFilters();
      setView('score');

      selectSong(0);
    }

    // Wyszukiwanie ignoruje wielkość liter i polskie znaki diakrytyczne
    function normalizeText(text) {
      // Litera „ł” nie rozkłada się przy NFD, więc zamieniamy ją osobno
      return text.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/gi, 'l').toLowerCase();
    }

    // Szukamy w pełnej ścieżce, więc działa też nazwa folderu. Ścieżki są już znormalizowane
    // (song.searchPath), a wyniki liczymy jednym przebiegiem po każdej zmianie zapytania
    function runSearch() {
      if (!searchQuery) {
        searchMatches = null;
        searchTotal = 0;
        return;
      }

      searchMatches = new Uint8Array(playlist.length);
      searchTotal = 0;
      playlist.forEach((song, index) => {
        if (song.searchPath.includes(searchQuery)) {
          searchMatches[index] = 1;
          searchTotal += 1;
        }
      });

      if (tree) markSearchHits(tree);
    }

    // Każdy węzeł dostaje flagę hit: czy pod nim jest choć jeden wynik. Pętla nie może się
    // przerwać na pierwszym trafieniu, bo flagi dzieci są potrzebne przy renderowaniu
    function markSearchHits(node) {
      if (node.type === 'file') {
        node.hit = searchMatches[node.index] === 1;
        return node.hit;
      }

      let hit = false;
      node.children.forEach(child => {
        if (markSearchHits(child)) hit = true;
      });
      node.hit = hit;
      return hit;
    }

    function updateSearchInfo() {
      if (!searchQuery) {
        els.searchInfo.textContent = '';
        return;
      }

      const shown = searchTotal > SEARCH_RENDER_LIMIT ? `, pokazano ${SEARCH_RENDER_LIMIT}` : '';
      els.searchInfo.textContent = `Znaleziono: ${searchTotal}${shown}`;
    }

    function renderTree() {
      els.tree.innerHTML = '';

      if (!tree) {
        const note = document.createElement('p');
        note.className = 'note';
        note.textContent = 'Brak wczytanych plików';
        els.tree.append(note);
        return;
      }

      if (searchQuery && !tree.hit) {
        const note = document.createElement('p');
        note.className = 'note';
        note.textContent = `Brak wyników dla „${els.searchInput.value.trim()}”`;
        els.tree.append(note);
      } else {
        renderBudget = searchQuery ? SEARCH_RENDER_LIMIT : Infinity;
        els.tree.append(renderChildren(tree, false));
      }

      updateSearchInfo();

      // Przy przełączaniu klawiaturą pokazujemy aktualny plik w drzewie (tylko na desktopie)
      if (window.innerWidth > 720) {
        const current = els.tree.querySelector('.file.current');
        if (current) current.scrollIntoView({ block: 'nearest' });
      }
    }

    function compareNodes(a, b) {
      if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
      return a.name.localeCompare(b.name, 'pl', { numeric: true });
    }

    function renderChildren(dir, nested) {
      const ul = document.createElement('ul');
      if (nested) ul.className = 'children';

      [...dir.children.values()]
        .filter(node => !searchQuery || node.hit)
        .sort(compareNodes)
        .forEach(node => {
          if (renderBudget <= 0) return;
          ul.append(node.type === 'dir' ? renderDir(node) : renderFile(node));
        });

      return ul;
    }

    function renderDir(dir) {
      const li = document.createElement('li');
      // Podczas wyszukiwania foldery z wynikami są zawsze rozwinięte
      const expanded = searchQuery ? true : expandedDirs.has(dir.path);
      const toggle = () => toggleDir(dir.path);

      li.className = 'dir';
      li.append(createRow(expanded, dir.name, dir.path, toggle, toggle));
      if (expanded) li.append(renderChildren(dir, true));

      return li;
    }

    function renderFile(node) {
      renderBudget -= 1;
      const li = document.createElement('li');
      const song = playlist[node.index];

      li.className = node.index === currentIndex ? 'file current' : 'file';
      // Plik nie ma rozwijania: ścieżki są w panelu obok partytury
      li.append(createRow(
        null,
        node.name,
        song.path,
        null,
        () => {
          setView('score');
          selectSong(node.index);
        },
      ));

      return li;
    }

    // Foldery mają strzałkę do rozwijania, pliki dostają puste miejsce o tej samej szerokości
    function createRow(expanded, label, title, onCaret, onLabel) {
      const row = document.createElement('div');
      const button = document.createElement('button');

      row.className = 'row';

      if (onCaret) {
        const caret = document.createElement('button');
        caret.type = 'button';
        caret.className = 'caret';
        caret.innerHTML = iconMarkup('chevron-right');
        caret.setAttribute('aria-expanded', String(expanded));
        caret.addEventListener('click', onCaret);
        row.append(caret);
      } else {
        const spacer = document.createElement('span');
        spacer.className = 'caret-spacer';
        row.append(spacer);
      }

      button.type = 'button';
      button.className = 'label';
      const text = document.createElement('span');
      text.className = 'label-text';
      text.textContent = label;
      button.insertAdjacentHTML('afterbegin', iconMarkup(onCaret ? 'folder' : 'music'));
      button.append(text);
      button.title = title;
      button.addEventListener('click', onLabel);

      row.append(button);
      return row;
    }

    // Panel ścieżek pokazuje tylko utwór wyświetlony w partyturze, bo tylko on brzmi i tylko on się drukuje
    function renderTrackPanel() {
      const song = loadedIndex >= 0 ? playlist[loadedIndex] : null;
      // Panel ścieżek jest dostępny też w bibliotece, bo sterowanie ścieżkami nie wymaga partytury na ekranie
      const visible = Boolean(song && api.score && trackPanelOpen);

      els.trackPanel.hidden = !visible;
      if (!visible) return;

      const names = trackNamesOf(api.score);
      els.trackPanelInfo.textContent = `Pokazane w partyturze: ${song.selected.length} z ${names.length}`;
      els.trackList.replaceChildren(...names.map((name, trackIndex) => createTrackItem(song, trackIndex, name)));
    }

    function createTrackItem(song, trackIndex, name) {
      const mix = mixOf(song, trackIndex);
      const shown = song.selected.includes(trackIndex);
      const li = document.createElement('li');
      const head = document.createElement('label');
      const checkbox = document.createElement('input');
      const swatch = document.createElement('span');
      const text = document.createElement('span');
      const mixRow = document.createElement('div');
      const muteBtn = document.createElement('button');
      const soloBtn = document.createElement('button');
      const volume = document.createElement('input');
      const volumeValue = document.createElement('span');

      li.className = shown ? 'track' : 'track is-hidden';

      // Pokazanie ścieżki w partyturze
      head.className = 'track-head';
      head.title = name;
      checkbox.type = 'checkbox';
      checkbox.checked = shown;
      checkbox.addEventListener('change', () => toggleTrack(trackIndex, checkbox));
      swatch.className = 'track-swatch';
      swatch.style.background = TRACK_COLORS[trackIndex % TRACK_COLORS.length];
      text.className = 'track-name';
      text.textContent = name;
      head.append(checkbox, swatch, text);

      // Wyciszenie i solo; zmiana od razu przestawia brzmienie, bez przerysowania listy
      mixRow.className = 'track-mix';
      muteBtn.type = 'button';
      muteBtn.className = 'mute';
      muteBtn.textContent = 'M';
      muteBtn.title = 'Wycisz ścieżkę';
      muteBtn.setAttribute('aria-label', `Wycisz: ${name}`);
      muteBtn.setAttribute('aria-pressed', String(mix.muted));
      muteBtn.addEventListener('click', () => {
        mix.muted = !mix.muted;
        renderTrackPanel();
        syncPlayback();
      });

      soloBtn.type = 'button';
      soloBtn.className = 'solo';
      soloBtn.textContent = 'S';
      soloBtn.title = 'Solo: słychać tylko ścieżki z solo';
      soloBtn.setAttribute('aria-label', `Solo: ${name}`);
      soloBtn.setAttribute('aria-pressed', String(mix.solo));
      soloBtn.addEventListener('click', () => {
        mix.solo = !mix.solo;
        renderTrackPanel();
        syncPlayback();
      });

      // Suwak zmienia głośność w trakcie przeciągania, więc tu nie przerysowujemy listy
      volume.type = 'range';
      volume.className = 'track-volume';
      volume.min = '0';
      volume.max = '200';
      volume.step = '5';
      volume.value = String(mix.volume);
      volume.setAttribute('aria-label', `Głośność: ${name}`);
      volumeValue.className = 'track-vol-value';
      volumeValue.textContent = `${mix.volume}%`;
      syncRange(volume);
      volume.addEventListener('input', () => {
        mix.volume = Number(volume.value);
        volumeValue.textContent = `${mix.volume}%`;
        syncPlayback();
      });

      mixRow.append(muteBtn, soloBtn, volume, volumeValue);
      li.append(head, mixRow);
      return li;
    }

    function toggleDir(path) {
      if (expandedDirs.has(path)) expandedDirs.delete(path);
      else expandedDirs.add(path);

      renderTree();
    }

    // Zaznaczenie ścieżki pokazuje ją w partyturze; panel dotyczy tylko wyświetlonego utworu
    function toggleTrack(trackIndex, checkbox) {
      const song = playlist[loadedIndex];
      const selected = new Set(song.selected);

      if (checkbox.checked) selected.add(trackIndex);
      else selected.delete(trackIndex);

      // Musi zostać przynajmniej jedna ścieżka, inaczej nie będzie czego pokazać ani wydrukować
      if (selected.size === 0) {
        checkbox.checked = true;
        return;
      }

      song.selected = [...selected].sort((a, b) => a - b);
      // Przygaszenie ukrytych ścieżek w panelu musi się zmienić od razu
      renderTrackPanel();
      api.renderTracks(song.selected.map(i => api.score.tracks[i]));
      syncPlayback();
    }

    async function selectSong(index) {
      if (index < 0 || index >= playlist.length) return;
      if (index === currentIndex && index === loadedIndex) return;

      const song = playlist[index];
      const token = ++loadToken;

      currentIndex = index;
      // Foldery prowadzące do wybranego utworu są rozwinięte, żeby był widoczny w drzewie
      const folders = song.path.split('/').slice(0, -1);
      folders.forEach((_, depth) => expandedDirs.add(folders.slice(0, depth + 1).join('/')));
      renderTree();
      clearMessage();
      els.songInfo.textContent = song.name;
      els.footerSong.textContent = [song.band, song.title].filter(Boolean).join(' – ');

      try {
        const data = await readSongBytes(song);
        if (token === loadToken) api.load(data, [...song.selected]);
      } catch (error) {
        if (token === loadToken) showMessage(`Nie udało się wczytać pliku „${song.name}”: ${error.message}`);
      }
    }

    api.scoreLoaded.on(score => {
      const name = [score.artist, score.title].filter(Boolean).join(' – ');

      loadedIndex = currentIndex;

      applyDisplayMode(score, false);
      syncPlayback();
      schedulePendingPlayback();
      updateLibraryPlayback();
      els.songInfo.textContent = name || 'Bez tytułu';
      els.placeholder.hidden = true;
      els.score.hidden = false;
      els.printBtn.disabled = false;
      els.trackPanelBtn.disabled = false;
      clearMessage();
      renderTree();
      renderTrackPanel();
    });

    api.error.on(error => {
      const song = playlist[currentIndex];

      loadedIndex = -1;
      playWhenReady = false;
      updateLibraryPlayback();

      showMessage(`Nie udało się wczytać pliku „${song ? song.name : ''}”: ${error.message}`);
      renderTree();
      renderTrackPanel();
    });

    function formatTime(ms) {
      const seconds = Math.floor(ms / 1000);
      return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
    }

    // Odtwarza tylko ścieżki widoczne w podglądzie (i nie wyciszone; przy solo tylko te z solo),
    // z ustawioną dla każdej głośnością
    function syncPlayback() {
      const song = playlist[loadedIndex];
      const ready = api.isReadyForPlayback;

      els.playBtn.disabled = !ready;
      els.seekBar.disabled = !ready;

      if (!ready || !song || !api.score) return;

      api.score.tracks.forEach((track, index) => {
        api.changeTrackVolume([track], mixOf(song, index).volume / 100);
        api.changeTrackMute([track], !isAudible(song, index));
      });
    }

    // Po gotowości syntezatora (MIDI i brzmienia załadowane) wyciszamy ścieżki spoza podglądu
    api.playerReady.on(() => {
      els.playStatus.textContent = '';
      syncPlayback();
      schedulePendingPlayback();
      updateLibraryPlayback();
    });
    api.soundFontLoad.on(progress => {
      if (progress.total > 0) {
        els.playStatus.textContent = `Ładowanie brzmień… ${Math.round(progress.loaded / progress.total * 100)}%`;
      }
    });

    api.playerStateChanged.on(args => {
      const playing = args.state === alphaTab.synth.PlayerState.Playing;
      setIcon(els.playBtn, playing ? 'pause' : 'play');
      els.playBtn.setAttribute('aria-label', playing ? 'Pauza' : 'Odtwórz');
      isPlaying = playing;
      updateLibraryPlayback();
      if (args.stopped) showNowPlaying([]);
    });

    // Nazwy dźwięków liczymy z numeru MIDI (60 = C4)
    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    function noteName(midi) {
      return `${NOTE_NAMES[midi % 12]}${Math.floor(midi / 12) - 1}`;
    }

    // Pokazuje, które dźwięki brzmią teraz w widocznych ścieżkach
    function showNowPlaying(beats) {
      const parts = [];

      beats.forEach(beat => {
        const track = beat.voice.bar.staff.track;
        if (!api.tracks.includes(track) || beat.isRest) return;

        if (track.isPercussion) {
          parts.push(`${track.name}: perkusja`);
          return;
        }

        beat.notes.forEach(note => {
          const fret = note.fret === 0 ? 'pusta' : `pr. ${note.fret}`;
          const label = `${noteName(note.realValue)} (${fret})`;
          parts.push(api.tracks.length > 1 ? `${track.name}: ${label}` : label);
        });
      });

      els.nowPlaying.textContent = parts.length ? parts.join(' · ') : '—';
      els.libMiniNotes.textContent = parts.join(' · ');
    }

    api.activeBeatsChanged.on(args => showNowPlaying(args.activeBeats));

    api.playerPositionChanged.on(args => {
      duration = args.endTime;
      if (!seeking) {
        els.seekBar.value = args.endTime ? Math.round(args.currentTime / args.endTime * 1000) : 0;
        syncRange(els.seekBar);
      }
      els.timeInfo.textContent = `${formatTime(args.currentTime)} / ${formatTime(args.endTime)}`;
    });

    els.playBtn.addEventListener('click', () => api.playPause());
    els.libMiniPlay.addEventListener('click', () => api.playPause());
    els.libMiniStop.addEventListener('click', () => {
      playWhenReady = false;
      api.stop();
    });
    els.stopBtn.addEventListener('click', () => api.stop());
    els.speedSelect.addEventListener('change', () => {
      api.playbackSpeed = Number(els.speedSelect.value);
    });
    els.masterVolume.addEventListener('input', () => {
      api.masterVolume = Number(els.masterVolume.value) / 100;
    });
    els.seekBar.addEventListener('input', () => {
      seeking = true;
    });
    els.seekBar.addEventListener('change', () => {
      api.timePosition = (els.seekBar.value / 1000) * duration;
      seeking = false;
    });

    function handleInput(input) {
      if (input.files.length === 0) return;

      setPlaylist([...input.files].map(file => ({
        file,
        path: file.webkitRelativePath || file.name,
      })));
      input.value = '';
    }

    els.searchInput.addEventListener('input', () => {
      searchQuery = normalizeText(els.searchInput.value.trim());
      runSearch();
      renderTree();
    });

    els.searchInput.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        els.searchInput.value = '';
        searchQuery = '';
        runSearch();
        renderTree();
      }

      // Enter otwiera pierwszy pasujący plik
      if (event.key === 'Enter' && searchQuery) {
        const first = searchMatches.indexOf(1);
        if (first >= 0) {
          setView('score');
          selectSong(first);
        }
      }
    });

    els.openFileBtn.addEventListener('click', () => els.fileInput.click());
    els.openFolderBtn.addEventListener('click', () => els.folderInput.click());

    // Menu „Otwórz” (DropdownMenu): zamyka się po wyborze, kliknięciu poza nim i klawiszem Escape
    const openMenuBtn = document.getElementById('openMenuBtn');
    const openMenuContent = document.getElementById('openMenuContent');

    function setOpenMenu(open, focusFirst = false) {
      openMenuContent.hidden = !open;
      openMenuBtn.setAttribute('aria-expanded', String(open));
      if (open && focusFirst) openMenuContent.querySelector('button').focus();
    }

    openMenuBtn.addEventListener('click', () => setOpenMenu(openMenuContent.hidden));
    openMenuBtn.addEventListener('keydown', event => {
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        setOpenMenu(true, true);
      }
    });
    openMenuContent.addEventListener('click', () => setOpenMenu(false));
    openMenuContent.addEventListener('keydown', event => {
      const items = [...openMenuContent.querySelectorAll('button')];
      const at = items.indexOf(document.activeElement);

      if (event.key === 'ArrowDown') items[(at + 1) % items.length].focus();
      else if (event.key === 'ArrowUp') items[(at - 1 + items.length) % items.length].focus();
      else if (event.key === 'Escape' || event.key === 'Tab') {
        setOpenMenu(false);
        if (event.key === 'Escape') openMenuBtn.focus();
        return;
      } else return;

      event.preventDefault();
    });
    document.addEventListener('click', event => {
      if (!event.target.closest('.menu')) setOpenMenu(false);
    });
    els.fileInput.addEventListener('change', () => handleInput(els.fileInput));
    els.folderInput.addEventListener('change', () => handleInput(els.folderInput));

    els.modes.forEach(button => {
      button.addEventListener('click', () => setDisplayMode(button.dataset.mode));
    });

    function setDisplayMode(mode) {
      displayMode = mode;
      els.modes.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
      });
      applyDisplayMode(api.score, true);
    }

    // Nuty i tabulatura to ustawienia każdej pięciolinii w modelu utworu, więc zmieniamy je tutaj
    function applyDisplayMode(score, render) {
      if (!score) return;

      score.tracks.forEach(track => track.staves.forEach(staff => {
        // Perkusja nie ma tabulatury, więc zawsze zostaje na nutach
        staff.showStandardNotation = displayMode !== 'tab' || !staff.isStringed;
        staff.showTablature = displayMode !== 'score' && staff.isStringed;
      }));

      if (render) api.render();
    }

    document.addEventListener('keydown', event => {
      if (event.target.matches?.('input, select, textarea')) return;
      // W bibliotece strzałki poruszają się po tabeli, a nie po utworach
      if (viewMode === 'library') return;
      if (event.key === 'ArrowLeft') selectSong(currentIndex - 1);
      if (event.key === 'ArrowRight') selectSong(currentIndex + 1);
    });

    // Wydruk renderuje partyturę w ukrytym kontenerze tej samej strony (bez popupu), w pełnej
    // szerokości strony A4, i dopiero po zakończeniu renderowania otwiera okno drukowania
    let printApi = null;

    function printScore() {
      if (!api.score || !api.tracks.length) return;

      if (printApi) printApi.destroy();
      els.printArea.innerHTML = '';

      printApi = new alphaTab.AlphaTabApi(els.printArea, {
        display: { layoutMode: 'page', scale: 0.8, stretchForce: 0.8 },
        core: { enableLazyLoading: false },
        player: { enablePlayer: false, enableCursor: false, enableUserInteraction: false },
      });

      let printed = false;
      printApi.postRenderFinished.on(() => {
        if (printed) return;
        printed = true;
        window.print();
      });

      try {
        printApi.renderTracks(api.tracks);
      } catch (error) {
        showMessage('Nie udało się przygotować wydruku.');
      }
    }

    els.printBtn.addEventListener('click', printScore);

    els.trackPanelBtn.setAttribute('aria-pressed', String(trackPanelOpen));
    els.trackPanelBtn.addEventListener('click', () => {
      trackPanelOpen = !trackPanelOpen;
      els.trackPanelBtn.setAttribute('aria-pressed', String(trackPanelOpen));
      renderTrackPanel();
    });

    document.addEventListener('dragover', event => event.preventDefault());
    document.addEventListener('drop', async event => {
      event.preventDefault();

      // Wpisy trzeba pobrać od razu, bo przeglądarka unieważnia je po zakończeniu zdarzenia
      const entries = [...event.dataTransfer.items]
        .map(item => item.webkitGetAsEntry())
        .filter(Boolean);
      const found = (await Promise.all(entries.map(entry => collectFiles(entry)))).flat();

      setPlaylist(found);
    });

    // ---- Biblioteka: tabela z sortowaniem i filtrami, które można łączyć ----
    // Zespół, tytuł, kolekcja i format wynikają ze ścieżki (tak jak w scripts/build-tabs-index.py),
    // gatunek i rok przychodzą z indeksu
    function songMeta(path) {
      const parts = path.split('/');
      const fileName = parts[parts.length - 1];
      const stem = fileName.replace(/\.[^.]+$/, '');
      const match = /^(.*?) - (.*)$/.exec(stem);
      const ext = fileName.match(/\.([^.]+)$/);

      return {
        collection: parts.length > 1 ? parts[0] : '',
        band: parts.length === 4 ? parts[2] : match ? match[1] : '',
        title: match ? match[2] : stem,
        format: ext ? ext[1].toUpperCase() : '',
      };
    }

    let viewMode = 'score';
    const libState = { key: 'band', dir: 1, page: 0 };
    const LIB_PAGE_SIZE = 200;
    const NO_GENRE = '__none';
    const CONFIDENCE_LABEL = { high: 'wysoka', medium: 'średnia', low: 'niska' };
    // Porównanie tekstu z polskimi znakami i liczbami w nazwie (np. „Part 2” przed „Part 10”)
    const collator = new Intl.Collator('pl', { numeric: true, sensitivity: 'base' });

    function setView(mode) {
      viewMode = mode;
      els.viewer.classList.toggle('library-mode', mode === 'library');
      els.library.hidden = mode !== 'library';
      els.viewButtons.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.view === mode));
      });
      if (mode === 'library') renderLibrary();
      renderTrackPanel();
    }

    // Przycisk „Foldery” tylko pokazuje albo chowa panel boczny, tak jak „Ścieżki” chowa panel ścieżek.
    // Nie zmienia widoku, więc biblioteka i partytura zostają takie, jakie były
    function renderFoldersPanel() {
      els.sidebar.hidden = !foldersOpen;
      els.foldersToggle.setAttribute('aria-pressed', String(foldersOpen));
    }

    renderFoldersPanel();
    els.foldersToggle.addEventListener('click', () => {
      foldersOpen = !foldersOpen;
      renderFoldersPanel();
    });

    // Motyw: domyślnie jasny; przełącznik zapamiętuje wybór w localStorage (jeśli dostępny)
    const THEME_KEY = 'gp-viewer-theme';

    function setTheme(dark) {
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      setIcon(els.themeToggle, dark ? 'sun' : 'moon');
    }

    setTheme(document.documentElement.dataset.theme === 'dark');
    els.themeToggle.addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme !== 'dark';
      setTheme(dark);
      try {
        localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
      } catch (error) {
        // Bez localStorage przełącznik działa, tylko nie zapamięta wyboru
      }
    });

    function fillSelect(select, allLabel, options) {
      const previous = select.value;
      const items = [new Option(allLabel, '')];
      options.forEach(([value, label]) => items.push(new Option(label, value)));
      select.replaceChildren(...items);
      select.value = options.some(([value]) => value === previous) ? previous : '';
    }

    function populateLibFilters() {
      const genres = [...new Set(playlist.map(song => song.genre).filter(Boolean))].sort(collator.compare);
      const collections = [...new Set(playlist.map(song => song.collection).filter(Boolean))].sort(collator.compare);

      fillSelect(els.libGenre, 'Wszystkie gatunki', [
        ...genres.map(genre => [genre, genre]),
        [NO_GENRE, 'Bez gatunku'],
      ]);
      fillSelect(els.libCollection, 'Wszystkie kolekcje', collections.map(name => [name, name]));
    }

    function readLibFilters() {
      return {
        query: normalizeText(els.libSearch.value.trim()),
        genre: els.libGenre.value,
        format: els.libFormat.value,
        collection: els.libCollection.value,
        from: els.libYearFrom.value === '' ? null : Number(els.libYearFrom.value),
        to: els.libYearTo.value === '' ? null : Number(els.libYearTo.value),
        sureOnly: els.libSureGenre.checked,
      };
    }

    // Każdy filtr zawęża wynik, więc można łączyć kilka wymiarów naraz
    function matchesLibrary(song, f) {
      if (f.query && !song.searchText.includes(f.query)) return false;
      if (f.genre === NO_GENRE && song.genre) return false;
      if (f.genre && f.genre !== NO_GENRE && song.genre !== f.genre) return false;
      if (f.format && song.format !== f.format) return false;
      if (f.collection && song.collection !== f.collection) return false;
      if (f.from !== null && (song.year === null || song.year < f.from)) return false;
      if (f.to !== null && (song.year === null || song.year > f.to)) return false;
      if (f.sureOnly && (!song.genre || song.genreConfidence === 'low')) return false;
      return true;
    }

    // Brakujące wartości zawsze na końcu, niezależnie od kierunku sortowania
    function compareSongs(a, b) {
      const { key, dir } = libState;
      const av = a[key];
      const bv = b[key];
      const aEmpty = av === null || av === undefined || av === '';
      const bEmpty = bv === null || bv === undefined || bv === '';
      if (aEmpty || bEmpty) return aEmpty === bEmpty ? 0 : aEmpty ? 1 : -1;

      const base = typeof av === 'number' ? av - bv : collator.compare(av, bv);
      if (base !== 0) return base * dir;
      return collator.compare(a.band, b.band) || collator.compare(a.title, b.title) || a.index - b.index;
    }

    function openFromLibrary(index) {
      setView('score');
      selectSong(index);
    }

    // Odtwarzanie z biblioteki: ten sam utwór przełącza pauzę, inny najpierw się wczytuje, a potem gra
    function playFromLibrary(index) {
      if (index === loadedIndex) {
        api.playPause();
        return;
      }

      playWhenReady = true;
      selectSong(index);
    }

    function startPendingPlayback() {
      if (!playWhenReady || loadedIndex < 0 || !api.isReadyForPlayback) return;

      playWhenReady = false;
      api.play();
    }

    // alphaTab po wczytaniu utworu może jeszcze raz przeładować MIDI i zatrzymać grę, więc
    // czekamy, aż zdarzenia się uspokoją, zanim zaczniemy odtwarzanie
    let pendingPlayTimer = 0;

    function schedulePendingPlayback() {
      if (!playWhenReady) return;

      clearTimeout(pendingPlayTimer);
      pendingPlayTimer = setTimeout(startPendingPlayback, 400);
    }

    api.midiLoad.on(schedulePendingPlayback);

    // Odświeża przyciski w wierszach i mini odtwarzacz według tego, co jest wczytane i czy gra
    function updateLibraryPlayback() {
      const loaded = loadedIndex >= 0 ? playlist[loadedIndex] : null;
      const ready = api.isReadyForPlayback;

      els.libMini.hidden = !loaded;
      els.libMiniTitle.textContent = loaded ? [loaded.band, loaded.title].filter(Boolean).join(' – ') : '';
      setIcon(els.libMiniPlay, isPlaying ? 'pause' : 'play');
      els.libMiniPlay.setAttribute('aria-label', isPlaying ? 'Pauza' : 'Odtwórz');
      els.libMiniPlay.disabled = !ready;

      els.libBody.querySelectorAll('button.lib-play').forEach(button => {
        const active = Number(button.dataset.index) === loadedIndex;
        const playing = active && isPlaying;

        setIcon(button, playing ? 'pause' : 'play');
        button.setAttribute('aria-label', `${playing ? 'Pauza' : 'Odtwórz'}: ${button.dataset.label}`);
        button.classList.toggle('is-current', active);
      });
    }

    function songRow(song) {
      const cell = text => {
        const td = document.createElement('td');
        td.textContent = text;
        return td;
      };

      const genre = cell(song.genre ?? '—');
      if (song.genreConfidence) genre.title = `Pewność gatunku: ${CONFIDENCE_LABEL[song.genreConfidence]}`;
      if (song.genreConfidence === 'low') genre.className = 'lib-low';

      // Przycisk odtwarzania nie otwiera partytury, dlatego zatrzymujemy zdarzenia przed wierszem
      const playCell = () => {
        const td = document.createElement('td');
        const button = document.createElement('button');
        const label = [song.band, song.title].filter(Boolean).join(' – ');

        td.className = 'lib-play-cell';
        button.type = 'button';
        button.className = 'lib-play icon-btn sm';
        button.dataset.index = song.index;
        button.dataset.label = label;
        button.innerHTML = iconMarkup('play', true);
        button.setAttribute('aria-label', `Odtwórz: ${label}`);
        button.addEventListener('click', event => {
          event.stopPropagation();
          playFromLibrary(song.index);
        });
        button.addEventListener('keydown', event => event.stopPropagation());
        td.append(button);
        return td;
      };

      // Format jako Badge (outline)
      const formatCell = format => {
        const td = document.createElement('td');
        if (format) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = format;
          td.append(badge);
        } else {
          td.textContent = '—';
        }
        return td;
      };

      const tr = document.createElement('tr');
      tr.tabIndex = 0;
      if (song.index === currentIndex) tr.className = 'current';
      tr.append(
        playCell(),
        cell(song.band || '—'),
        cell(song.title),
        genre,
        cell(song.year ?? '—'),
        cell(song.collection || '—'),
        formatCell(song.format),
      );

      tr.addEventListener('click', () => openFromLibrary(song.index));
      tr.addEventListener('keydown', event => {
        if (event.key === 'Enter') openFromLibrary(song.index);
      });
      return tr;
    }

    function renderLibrary() {
      const filters = readLibFilters();
      const rows = playlist.filter(song => matchesLibrary(song, filters)).sort(compareSongs);
      const pages = Math.max(1, Math.ceil(rows.length / LIB_PAGE_SIZE));
      libState.page = Math.min(libState.page, pages - 1);
      const start = libState.page * LIB_PAGE_SIZE;

      els.libBody.replaceChildren(...rows.slice(start, start + LIB_PAGE_SIZE).map(songRow));
      els.libCount.textContent = `Znaleziono: ${rows.length} z ${playlist.length}`;
      els.libPage.textContent = `Strona ${libState.page + 1} z ${pages}`;
      els.libPrev.disabled = libState.page === 0;
      els.libNext.disabled = libState.page >= pages - 1;
      updateLibraryPlayback();

      document.querySelectorAll('.lib-table th').forEach(th => {
        const button = th.querySelector('button.sort');
        if (!button) return;
        const active = button.dataset.key === libState.key;
        th.setAttribute('aria-sort', active ? (libState.dir === 1 ? 'ascending' : 'descending') : 'none');
        setIcon(button, active ? (libState.dir === 1 ? 'arrow-up' : 'arrow-down') : 'arrow-up-down');
      });
    }

    els.viewButtons.forEach(button => {
      button.addEventListener('click', () => setView(button.dataset.view));
    });

    document.querySelectorAll('.lib-table th button.sort').forEach(button => {
      button.addEventListener('click', () => {
        const key = button.dataset.key;
        libState.dir = libState.key === key ? -libState.dir : 1;
        libState.key = key;
        libState.page = 0;
        renderLibrary();
      });
    });

    [els.libSearch, els.libYearFrom, els.libYearTo].forEach(control => {
      control.addEventListener('input', () => {
        libState.page = 0;
        renderLibrary();
      });
    });

    [els.libGenre, els.libFormat, els.libCollection, els.libSureGenre].forEach(control => {
      control.addEventListener('change', () => {
        libState.page = 0;
        renderLibrary();
      });
    });

    els.libReset.addEventListener('click', () => {
      els.libSearch.value = '';
      els.libGenre.value = '';
      els.libFormat.value = '';
      els.libCollection.value = '';
      els.libYearFrom.value = '';
      els.libYearTo.value = '';
      els.libSureGenre.checked = false;
      libState.page = 0;
      renderLibrary();
    });

    els.libPrev.addEventListener('click', () => {
      libState.page -= 1;
      renderLibrary();
    });

    els.libNext.addEventListener('click', () => {
      libState.page += 1;
      renderLibrary();
    });

    document.querySelectorAll('input[type="range"]').forEach(syncRange);

    loadLibrary();
  </script>
</body>
</html>
